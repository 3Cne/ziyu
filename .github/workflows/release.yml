name: Release APK

on:
  # 只用 Actions 页面手动触发。
  # 本地签名密钥不在仓库里，tag 自动触发会拿不到 keystore 而失败；
  # 等 Secrets 配齐（KEYSTORE_BASE64 等）后，再取消下面 push/release 的注释即可恢复全自动。
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"
  # release:
  #   types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: |
          yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" || true

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > moyu-release.keystore
          cat > keystore.properties <<EOF
          storeFile=moyu-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-moyu}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
          chmod +x gradlew

      - name: Build release
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./gradlew :app:assembleRelease --no-daemon -PupdateRepo=${{ github.repository }}

      - name: Rename APK
        run: |
          mkdir -p dist
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/ziyu-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ziyu-${{ github.event.release.tag_name || github.ref_name }}.apk
          generate_release_notes: true
          draft: false
